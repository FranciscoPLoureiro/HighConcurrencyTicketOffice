# Fly.io deployment for the API.
#
# This file is complete and unapplied: nothing here has been deployed, no
# account has been created, and no credential is stored in the repository. What
# it takes to go live is written up in the README under "Deploying it", and the
# short version is three `fly` commands and one GitHub secret — all of which
# have to be run by somebody holding the account.
#
# Only the API is described here. The worker is a second Fly app built from
# docker/worker.Dockerfile with the same secrets and no HTTP service; it is left
# out rather than guessed at, because a second app needs a second name and the
# name is the one thing this file cannot choose on somebody else's behalf.

app = "high-concurrency-ticket-office"
primary_region = "cdg"

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  HTTP_ADDR = ":8080"
  # The campaign a public instance serves. Deliberately a different id from the
  # local default, so that a demo instance and a developer's machine can never
  # be confused for one another in a log line.
  CAMPAIGN_ID = "queima-2026-public"
  TOTAL_TICKETS = "100"
  LOG_LEVEL = "info"

  # A public instance is a demonstration, not a load target. The per-address
  # limit that is deliberately loose locally — a university behind a handful of
  # NAT addresses — is wrong here, where every visitor is a different address
  # and the only traffic worth stopping is a script.
  RATE_LIMIT_WINDOW = "10s"
  RATE_LIMIT_USER = "5"
  RATE_LIMIT_IP = "60"

[http_service]
  internal_port = 8080
  # Fly terminates TLS and redirects, so the app never sees plain HTTP.
  force_https = true
  # Zero is deliberate. The stock invariant is rebuilt from PostgreSQL at
  # startup under a distributed lock, so a cold start is correct but not
  # instant, and a recruiter clicking the link should not wait for a
  # reconciliation. It also means the demo costs money while it is up, which is
  # the honest trade.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # The same endpoint the container healthcheck uses. It reports each
    # dependency separately and answers 503 if any of them is unreachable, so
    # this takes an instance out of rotation for the right reasons.
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  # The smallest machine that comfortably runs a Go process with a connection
  # pool. The load figures in the README come from a developer machine with the
  # generator inside the Docker network, and nothing about this size is claimed
  # to reproduce them — the public URL exists so the pipeline can be seen
  # working and the endpoint clicked, not as a benchmark target.
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets, set with `fly secrets set` and never written here:
#
#   POSTGRES_DSN   Fly Postgres, or any reachable instance
#   REDIS_ADDR     Upstash Redis over TLS, or a Fly Redis
#   REDIS_PASSWORD
#   RABBITMQ_URL   CloudAMQP free tier is enough for this
#
# The API will not start without all four. That is intentional: it migrates the
# schema and reconciles the stock before it listens, and an instance that came
# up without a database would serve a healthy-looking 503 and sell nothing.
