# Local development stack.
#
# The credentials here are throwaway development values, committed on purpose so
# that a fresh clone runs with no setup. A deployment supplies every one of them
# through the environment and shares none of these defaults.
name: ticket-office

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://tickets:tickets@rabbitmq:5672/
      LOG_LEVEL: info
      # Overridable from the host, and the load test is the reason. Every
      # virtual user comes from one container and therefore one address, which
      # is exactly the traffic shape the per-address limit exists to stop — so
      # with it on, a campaign-scale run measures the rate limiter and nothing
      # else. `make load-test-ramp` sets this to 0.
      #
      # The per-account limit stays on throughout. That is the one doing the
      # real work here anyway; the address limit is deliberately loose, because
      # the audience is a university behind a handful of NAT addresses.
      RATE_LIMIT_IP: "${RATE_LIMIT_IP:-1000}"

      # Overridable so the lost-ticket demonstration can be run against this
      # stack without editing anything. See "the lost ticket" in
      # docs/DECISIONS.md:
      #
      #   FAULT_INJECTION=after-decrement REQUEST_TIMEOUT=5s \
      #     RESERVATION_AGE=15s SWEEP_INTERVAL=5s docker compose up -d --wait api
      #
      # The request budget comes down with the reservation age, and has to:
      # the API refuses to start unless a reservation outlasts a request plus
      # one more database budget, because a COMMIT abandoned at the deadline
      # can still land afterwards and the sweeper would release a seat that is
      # about to be taken. Shortening the recovery window safely means
      # shortening what it has to outlast.
      #
      # FAULT_INJECTION is empty everywhere else, and an unrecognised value
      # makes the API refuse to start rather than disarm quietly.
      FAULT_INJECTION: "${FAULT_INJECTION:-}"
      FAULT_KILL: "${FAULT_KILL:-false}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-10s}"
      RESERVATION_AGE: "${RESERVATION_AGE:-60s}"
      SWEEP_INTERVAL: "${SWEEP_INTERVAL:-15s}"
    ports:
      - "8080:8080"
    # How long Docker waits after SIGTERM before sending SIGKILL.
    #
    # Set explicitly because the default is ten seconds and this process is
    # configured to need more: SHUTDOWN_TIMEOUT gives the server fifteen to
    # drain in-flight requests, and the sweeper pass it then waits for has a
    # budget of SWEEP_INTERVAL on top. Left at the default, every `compose
    # stop`, `restart` and recreate kills the API in the middle of the drain
    # that graceful shutdown exists to perform — including the restart in
    # scripts/reset.sh, which runs before every load test.
    #
    # Raise this with SHUTDOWN_TIMEOUT if that is ever raised. The cost of
    # generosity is nothing: the process exits as soon as it is done, and an
    # idle one exits immediately.
    stop_grace_period: 30s
    # Explicit limits, because a load test against an unbounded container
    # measures the developer's laptop rather than the service. The machine
    # these were chosen for is declared in docs/MEASUREMENT.md; the point is
    # not the numbers but that the same numbers apply on every run.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    depends_on:
      # Waiting on health rather than on start. The API tolerates a missing
      # dependency by design, but a stack that comes up reporting 503 for the
      # first thirty seconds makes `make up` useless as a gate for the tests
      # and the load test that follow it.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # The runtime image has no shell, so the binary probes itself.
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The worker is scaled independently of the API, which is the point of it
  # being a separate process: `docker compose up -d --scale worker=3` adds
  # fulfilment capacity without touching the thing serving requests.
  #
  # No published port and no healthcheck. It serves nothing, and whether it is
  # working is visible in the depth of ticket_processing_queue rather than in
  # anything it could answer about itself.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      POSTGRES_DSN: postgres://tickets:tickets@postgres:5432/tickets?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://tickets:tickets@rabbitmq:5672/
      LOG_LEVEL: info
    # The worker's equivalent, and it needs one for a sharper reason than the
    # API does. The brief asks that a worker finish the message in its hand
    # before it closes, and the consumer implements exactly that — it stops
    # taking new deliveries and lets the one in flight run to completion under
    # its own budget, which is FULFILMENT_DELAY plus POSTGRES_TIMEOUT plus a
    # margin. That is twelve seconds with these defaults, against a ten second
    # grace period, so the default made the guarantee unreachable by two
    # seconds on every deploy.
    #
    # A killed message is not lost — it is unacknowledged, so the broker
    # redelivers it and the handler is idempotent — but "we survive it" is not
    # the same as "it does not happen", and the deliverable was the second one.
    stop_grace_period: 30s
    # Explicit limits, because a load test against an unbounded container
    # measures the developer's laptop rather than the service. The machine
    # these were chosen for is declared in docs/MEASUREMENT.md; the point is
    # not the numbers but that the same numbers apply on every run.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # The API owns the schema, so the worker must not start querying tables
      # that do not exist yet. Waiting for the API to be healthy is waiting for
      # the migrations to have run.
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    # Explicit limits, because a load test against an unbounded container
    # measures the developer's laptop rather than the service. The machine
    # these were chosen for is declared in docs/MEASUREMENT.md; the point is
    # not the numbers but that the same numbers apply on every run.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      # Published so the API can also be run straight from the host with
      # `go run ./cmd/api`, and so integration tests can reach it directly.
      - "5432:5432"
    volumes:
      # Postgres 18 images store data in a major-version subdirectory so that
      # `pg_upgrade --link` works without crossing a mount boundary. Mounting
      # the older /var/lib/postgresql/data path makes the container refuse to
      # start rather than silently ignore the volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Postgres starts, shuts down and restarts once during first-run
      # initialisation. Without a real readiness probe, anything depending on
      # it connects during that window and fails on an otherwise fine stack.
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    # Explicit limits, because a load test against an unbounded container
    # measures the developer's laptop rather than the service. The machine
    # these were chosen for is declared in docs/MEASUREMENT.md; the point is
    # not the numbers but that the same numbers apply on every run.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    # Persistence is configured rather than left to the image default, which
    # is RDB snapshots alone: with those, a crash loses every write since the
    # last snapshot, and the default schedule measures that in minutes. For a
    # campaign that is decided in the first few seconds, a snapshot taken
    # minutes ago is the same as no snapshot.
    #
    # AOF with everysec bounds the loss at roughly one second of writes. Not
    # zero — `always` would be, at the cost of an fsync on the critical path of
    # every purchase, which is the one path this design spends effort keeping
    # fast. One second of tickets is recoverable; the latency is not.
    #
    # Both are on, because they answer different questions: the AOF is what
    # replays after a crash, and the RDB is the compact file worth copying
    # somewhere else.
    #
    # None of this is what makes the system correct after Redis dies. The AOF
    # narrows the gap; startup reconciliation from PostgreSQL closes it, and
    # would close it just as well if the AOF were empty.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60 1000"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # Explicit limits, because a load test against an unbounded container
    # measures the developer's laptop rather than the service. The machine
    # these were chosen for is declared in docs/MEASUREMENT.md; the point is
    # not the numbers but that the same numbers apply on every run.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      RABBITMQ_DEFAULT_USER: tickets
      RABBITMQ_DEFAULT_PASS: tickets
    ports:
      - "5672:5672"
      # Management UI. Useful for watching queue depth and the dead letter
      # queue by hand while developing phase 3.
      - "15672:15672"
    volumes:
      # The memory watermark, which has to be a file: RabbitMQ 4 rejects the
      # equivalent environment variable as deprecated and refuses to start.
      # See the config for why the value is set at all.
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-limits.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # 15s, not 5. rabbitmq-diagnostics starts an Erlang node to ask the
      # question, and on the one CPU this container is limited to that takes
      # about eight seconds — so a five second timeout could never pass, and
      # the service sat "unhealthy" while answering AMQP perfectly well. The
      # limit did not break RabbitMQ; it broke the probe.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      # The Erlang VM takes far longer to become useful than the other two.
      # A short start_period here marks the whole stack unhealthy on a cold
      # boot of a machine that is doing nothing wrong.
      retries: 10
      start_period: 40s

  # Observability. Both are provisioned entirely by file — no clicking, no
  # dashboard saved in somebody's browser, and a screenshot in the docs that
  # anybody can reproduce with one command.
  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A campaign is over in seconds and these are local runs, so there is
      # nothing to keep for a fortnight.
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      # Anonymous viewing, deliberately. This is a local stack whose only
      # secret is a throwaway Postgres password, and a login prompt between a
      # reader and the dashboard is friction with nothing behind it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      # Opens straight on the dashboard rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticket-office.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Points Grafana at the renderer above when it is running. Harmless when
      # it is not: the render endpoint fails, and nothing else uses it.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      - prometheus

  # Headless Chromium, so that the dashboard in the docs is exported by a
  # command rather than cropped out of somebody's browser. Behind a profile
  # because it is a documentation tool and has no business in the stack a load
  # test measures — `docker compose --profile tools up -d renderer`, or just
  # `make dashboard`.
  renderer:
    image: grafana/grafana-image-renderer:latest
    profiles: ["tools"]
    environment:
      ENABLE_METRICS: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
