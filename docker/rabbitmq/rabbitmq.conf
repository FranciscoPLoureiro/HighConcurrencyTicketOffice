# RabbitMQ configuration for the local stack.
#
# One setting, and it exists because of something the resource limits in
# docker-compose.yml exposed.

# RabbitMQ does not see the container's memory limit. Left to itself it reads
# the host's 8 GB and puts its high watermark at 4.8 GB — nine times the 512 MB
# it is actually capped at. The consequence is not a slightly wrong number: the
# memory alarm is how RabbitMQ applies backpressure to publishers, so a watermark
# above the cgroup limit means it never raises one and is OOM-killed instead,
# taking the queue with it and with nothing in its own logs to explain why.
#
# 300 MB leaves the Erlang VM headroom to live inside the cap.
#
# Set here rather than through RABBITMQ_VM_MEMORY_HIGH_WATERMARK, which RabbitMQ
# 4 rejects outright as deprecated — the container refuses to start.
vm_memory_high_watermark.absolute = 300MB
