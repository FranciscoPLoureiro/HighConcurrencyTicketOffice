# Prometheus configuration for the local stack.
#
# Two jobs, because the API and the worker answer different questions and a
# single job over both would make "which process is slow?" unanswerable without
# a label nobody thought to add.

global:
  # Five seconds rather than the usual fifteen. A campaign is decided inside a
  # few seconds, so a fifteen second interval would capture the whole thing in
  # one or two samples and every graph in the dashboard would be a straight
  # line between two points.
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  - job_name: worker
    # Resolved by Docker's DNS, which returns every container behind the
    # service name — so `--scale worker=3` is scraped as three targets without
    # touching this file.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
    relabel_configs:
      - target_label: service
        replacement: worker
