name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A run whose commit has already been superseded tells nobody anything and
# occupies a runner that the current commit needs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  verify:
    name: build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so the toolchain can never drift
          # away from what the module declares.
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        # A stale go.mod passes locally and fails for the next person to
        # clone. Cheaper to catch here than in someone else's checkout.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than "latest": a new release adding a check should
          # be a deliberate commit, not a build that breaks on a Tuesday.
          version: v2.12.2

      - name: Test
        # -race is the entire point of this pipeline for a project about
        # concurrency. -shuffle=on catches tests that only pass because of
        # the order they happen to run in.
        #
        # No coverage measured here. This job runs without the integration
        # tag, so the packages carrying the heaviest tests would report zero
        # and the total would understate the suite by most of it. The honest
        # number comes from the integration job, which has the tag on.
        run: go test -race -shuffle=on ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    # Real containers are slower to start than the unit suite, which is why
    # these live behind a build tag and in their own job. They still run on
    # every push: an integration suite that is skipped is not a suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        # The runner provides Docker directly, so Testcontainers needs none
        # of the socket plumbing the local Makefile target sets up.
        #
        # Coverage is measured here rather than in the verify job, because
        # this is the only place the integration tag is on. -coverpkg=./... is
        # the other half: without it, coverage counts only the package a test
        # lives in, and the end-to-end suite that drives the store and the
        # queue through a real broker would credit neither.
        run: |
          go test -race -shuffle=on -tags=integration -timeout 900s \
            -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1

  load:
    name: load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        # The per-address rate limit is off for the run, because every virtual
        # user comes from one container and therefore one address — which is
        # exactly the traffic the limit exists to stop. Left on, this job
        # measures the rate limiter. The per-account limit stays on.
        env:
          RATE_LIMIT_IP: "0"
        run: docker compose up -d --build --wait

      - name: Reset to the state a campaign starts in
        # Without this a second run sells zero tickets, because the campaign is
        # already gone, and the job fails in a way indistinguishable from a real
        # regression.
        run: COMPOSE="docker compose" sh scripts/reset.sh

      - name: Run the campaign
        # Fewer virtual users than the declared local measurement. A hosted
        # runner is a shared machine with neighbours nobody can see, so the
        # operating point here is deliberately conservative: this job exists to
        # catch a regression in the invariant, not to publish a latency figure.
        # The numbers in docs/MEASUREMENT.md come from the declared environment.
        run: |
          docker run --rm --network ticket-office_default \
            -v "$PWD/loadtest":/loadtest \
            -e BASE_URL=http://api:8080 -e VUS=50 \
            grafana/k6:latest run /loadtest/ramp.js

      - name: Check the invariants in the source of truth
        # k6 asserts what it was told; this asserts what is true. The fairness
        # rule in particular is invisible to the generator — every virtual user
        # has its own identity, so a run in which one person was sold every
        # ticket would look perfect from k6 and be the worst possible outcome.
        run: COMPOSE="docker compose" sh scripts/verify-campaign.sh

      - name: Show what the services said if it failed
        if: failure()
        run: docker compose logs --tail 200 api worker

  image:
    name: build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Plain docker build rather than a marketplace action: the runner
      # already has Docker, and this cannot break on an action's major bump.
      - name: Build the api image
        run: docker build -f docker/api.Dockerfile -t ticket-office-api:ci .

      # Built here too, because a worker that does not compile into an image is
      # a deploy that fails at the worst moment rather than in CI.
      - name: Build the worker image
        run: docker build -f docker/worker.Dockerfile -t ticket-office-worker:ci .
